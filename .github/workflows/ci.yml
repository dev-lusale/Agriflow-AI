name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: agriflow
          POSTGRES_DB: agriflow
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # CI-only throwaway database; nothing here is a production credential.
      DATABASE_URL: postgresql://postgres:agriflow@localhost:5544/agriflow
      DIRECT_URL: postgresql://postgres:agriflow@localhost:5544/agriflow
      TEST_DATABASE_URL: postgresql://postgres:agriflow@localhost:5544/agriflow_test
      APP_URL: http://localhost:3100
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      DEMO_MODE: "true"
      DEMO_PASSWORD: ci-demo-${{ github.run_id }}
      WEATHER_PROVIDER: open-meteo
      XAI_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Create test database
        run: |
          PGPASSWORD=agriflow psql -h localhost -p 5544 -U postgres -c "CREATE DATABASE agriflow_test;"
          PGPASSWORD=agriflow psql -h localhost -p 5544 -U postgres -c "CREATE DATABASE agriflow_shadow;"
      - name: Install
        run: mkdir -p ci-logs && npm ci 2>&1 | tee ci-logs/01-install.log
      - id: drift
        name: Migrations match schema (no drift)
        continue-on-error: true
        run: |
          set -o pipefail
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:agriflow@localhost:5544/agriflow_shadow --exit-code 2>&1 | tee ci-logs/02a-migration-drift.log
      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: set -o pipefail; npm run typecheck 2>&1 | tee ci-logs/02-typecheck.log
      - id: lint
        name: Lint
        continue-on-error: true
        run: set -o pipefail; npm run lint 2>&1 | tee ci-logs/03-lint.log
      - id: unit
        name: Unit + integration tests (Vitest, real Postgres)
        continue-on-error: true
        run: set -o pipefail; npx vitest run --reporter=verbose 2>&1 | tee ci-logs/04-vitest.log
      - id: migrate
        name: Migrate + seed e2e database
        continue-on-error: true
        run: set -o pipefail; (npm run db:deploy && npm run db:seed) 2>&1 | tee ci-logs/05-migrate-seed.log
      - id: build
        name: Production build
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee ci-logs/06-build.log
      - id: e2e
        name: End-to-end tests (Playwright)
        if: steps.build.outcome == 'success' && steps.migrate.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium > ci-logs/07-playwright-install.log 2>&1
          npx playwright test --reporter=list 2>&1 | tee ci-logs/08-e2e.log
      - name: Summarise
        if: always()
        run: |
          {
            echo "# AgriFlow CI — run ${{ github.run_number }}"
            echo
            echo "- Commit: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`"
            echo "- Date (UTC): $(date -u +%FT%TZ)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Migrations match schema | ${{ steps.drift.outcome }} |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Vitest (unit + integration) | ${{ steps.unit.outcome }} |"
            echo "| Migrate + seed | ${{ steps.migrate.outcome }} |"
            echo "| Production build | ${{ steps.build.outcome }} |"
            echo "| Playwright e2e | ${{ steps.e2e.outcome || 'skipped' }} |"
            echo
            echo "## Vitest totals"; grep -E "Test Files|Tests  " ci-logs/04-vitest.log | tail -2 || true
            echo; echo "## Playwright totals"; grep -E "passed|failed|skipped" ci-logs/08-e2e.log 2>/dev/null | tail -3 || true
          } > ci-logs/SUMMARY.md
          cat ci-logs/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          [ -d test-results ] && zip -qr ci-logs/playwright-failures.zip test-results || true
          zip -qr ci-results.zip ci-logs
      - name: Publish results to the "ci-latest" release
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --cleanup-tag -y 2>/dev/null || true
          gh release create ci-latest ci-results.zip ci-logs/SUMMARY.md \
            --prerelease --target "${{ github.sha }}" \
            --title "CI results (latest) — ${{ github.ref_name }} @ ${GITHUB_SHA::7}" \
            --notes-file ci-logs/SUMMARY.md
      - name: Fail if any check failed
        if: always()
        run: |
          for o in "${{ steps.drift.outcome }}" "${{ steps.typecheck.outcome }}" "${{ steps.lint.outcome }}" "${{ steps.unit.outcome }}" "${{ steps.migrate.outcome }}" "${{ steps.build.outcome }}" "${{ steps.e2e.outcome }}"; do
            [ "$o" = "failure" ] && exit 1
          done; exit 0
