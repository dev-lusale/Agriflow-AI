name: Flutter app

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile_app
    env:
      BUILD_NAME: 1.0.${{ github.run_number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare
        run: |
          mkdir -p ../flutter-results
          flutter --version | tee ../flutter-results/flutter-version.txt
          flutter pub get
          dart run flutter_launcher_icons > ../flutter-results/icons.log 2>&1
          dart run flutter_native_splash:create > ../flutter-results/splash.log 2>&1
      - id: analyze
        name: Static analysis
        continue-on-error: true
        run: set -o pipefail; flutter analyze --no-fatal-infos 2>&1 | tee ../flutter-results/analyze.log
      - id: test
        name: Unit and widget tests
        continue-on-error: true
        run: set -o pipefail; flutter test --reporter expanded 2>&1 | tee ../flutter-results/test.log
      - name: Release signing (optional, from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.AGRIFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "AGRIFLOW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - id: debug
        name: Build debug APK
        continue-on-error: true
        run: set -o pipefail; flutter build apk --debug --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" 2>&1 | tee ../flutter-results/build-debug.log
      - id: release
        name: Build release APK and App Bundle
        continue-on-error: true
        env:
          AGRIFLOW_KEYSTORE_PASSWORD: ${{ secrets.AGRIFLOW_KEYSTORE_PASSWORD }}
          AGRIFLOW_KEY_ALIAS: ${{ secrets.AGRIFLOW_KEY_ALIAS }}
          AGRIFLOW_KEY_PASSWORD: ${{ secrets.AGRIFLOW_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" 2>&1 | tee ../flutter-results/build-release.log
          flutter build appbundle --release --build-name "$BUILD_NAME" --build-number "$BUILD_NUMBER" 2>&1 | tee ../flutter-results/build-aab.log
      - name: List outputs
        if: always()
        run: find build/app/outputs -name "*.apk" -o -name "*.aab" | xargs -r ls -la | tee ../flutter-results/outputs.txt
      - name: Enable KVM
        if: steps.debug.outcome == 'success'
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test — standard phone (Pixel 6, API 34)
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: .
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/flutter-smoke.sh pixel6
      - name: Emulator test — small phone (Nexus 4, API 30)
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: .
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/flutter-smoke.sh small
      - name: Collect and publish
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p dist flutter-results
          O=mobile_app/build/app/outputs
          cp $O/flutter-apk/app-debug.apk dist/AgriFlowAI-$BUILD_NAME-debug.apk 2>/dev/null
          sfx=$([ "$SIGNED" = yes ] && echo "" || echo "-UNSIGNED")
          for f in $O/flutter-apk/app-release*.apk $O/apk/release/app-release*.apk; do [ -f "$f" ] && cp "$f" "dist/AgriFlowAI-$BUILD_NAME-release$sfx.apk" && break; done
          [ -f $O/bundle/release/app-release.aab ] && cp $O/bundle/release/app-release.aab "dist/AgriFlowAI-$BUILD_NAME-release$sfx.aab"
          (cd dist && ls *.apk *.aab >/dev/null 2>&1 && sha256sum *.apk *.aab > SHA256SUMS.txt)
          {
            echo "# AgriFlow AI (Flutter) — build $BUILD_NAME"
            echo; echo "- Commit: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`"; echo "- Release signing: $SIGNED"; echo
            echo "| Step | Result |"; echo "|---|---|"
            echo "| flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| unit + widget tests | ${{ steps.test.outcome }} |"
            echo "| debug APK | ${{ steps.debug.outcome }} |"
            echo "| release APK + AAB | ${{ steps.release.outcome }} |"
            echo; echo "## Analyzer"; echo '```'; tail -3 flutter-results/analyze.log; echo '```'
            echo "## Tests"; echo '```'; grep -E "All tests passed|Some tests failed|\+[0-9]+.*:" flutter-results/test.log | tail -2; echo '```'
            echo "## Emulator checks"; echo '```'; cat flutter-results/*/checks.txt 2>/dev/null || echo "not run"; cat flutter-results/*/totals.txt 2>/dev/null; echo '```'
            echo "## Files"; echo '```'; ls -la dist; echo '```'
          } > flutter-results/SUMMARY.md
          cat flutter-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          for f in flutter-results/*.log; do tail -c 60000 "$f" > "$f.tail"; done
          zip -qr dist/flutter-test-results.zip flutter-results
          shopt -s nullglob
          shots=(); for p in flutter-results/*/*.png; do n=$(echo "$p" | sed 's|flutter-results/||; s|/|-|'); cp "$p" "dist/$n"; done
          gh release delete flutter-latest --cleanup-tag -y 2>/dev/null
          gh release create flutter-latest --prerelease --target "${{ github.sha }}" --title "AgriFlow AI Flutter $BUILD_NAME (latest build)" --notes-file flutter-results/SUMMARY.md || exit 1
          rc=0
          for f in dist/*; do [ -s "$f" ] || continue; gh release upload flutter-latest "$f" --clobber || rc=1; done
          exit $rc
      - name: Fail on problems
        if: always()
        working-directory: .
        run: |
          test "${{ steps.analyze.outcome }}" = success && test "${{ steps.test.outcome }}" = success && test "${{ steps.debug.outcome }}" = success && test "${{ steps.release.outcome }}" = success && ! grep -q "failed=[1-9]" flutter-results/*/totals.txt
