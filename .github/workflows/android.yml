name: Android

on:
  push:
    branches: [main, "feat/**"]
    paths: ["android/**", "mobile/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android.yml", ".github/scripts/android-smoke.sh"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGRIFLOW_VERSION_CODE: ${{ github.run_number }}
      AGRIFLOW_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/build-tools" | tail -3
      - name: Install JS dependencies and sync Capacitor
        run: |
          npm ci --ignore-scripts
          npx cap sync android

      # Release signing — only if the owner has added these GitHub Secrets. Never committed.
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.AGRIFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agriflow-release.jks"
            echo "AGRIFLOW_KEYSTORE_PATH=$RUNNER_TEMP/agriflow-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi

      - id: gradle
        name: Build debug APK, release APK and release AAB
        continue-on-error: true
        env:
          AGRIFLOW_KEYSTORE_PASSWORD: ${{ secrets.AGRIFLOW_KEYSTORE_PASSWORD }}
          AGRIFLOW_KEY_ALIAS: ${{ secrets.AGRIFLOW_KEY_ALIAS }}
          AGRIFLOW_KEY_PASSWORD: ${{ secrets.AGRIFLOW_KEY_PASSWORD }}
        run: |
          mkdir -p android-results
          cd android
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease 2>&1 | tee ../android-results/gradle-build.log

      - name: Inspect build outputs
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT=android-results
          find android/app/build/outputs -name "*.apk" -o -name "*.aab" | sort | tee $OUT/outputs.txt
          "$BT/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk > $OUT/badging-debug.txt
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > $OUT/apksigner-debug.txt 2>&1 || true
          REL=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/apksigner" verify --print-certs "$REL" > $OUT/apksigner-release.txt 2>&1 || echo "release APK is not signed (no signing secrets configured)" >> $OUT/apksigner-release.txt

      - name: Enable KVM for the emulator
        if: steps.gradle.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator smoke test (Android 14, API 34)
        if: steps.gradle.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/android-smoke.sh

      - name: Collect artifacts
        if: always()
        run: |
          set +e
          mkdir -p dist android-results
          [ -f android-results/gradle-build.log ] && tail -120 android-results/gradle-build.log > android-results/gradle-tail.log || true
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AgriFlowAI-${AGRIFLOW_VERSION_NAME}-debug.apk 2>/dev/null || true
          for f in android/app/build/outputs/apk/release/*.apk; do
            [ -f "$f" ] || continue
            if [ "$SIGNED" = "yes" ]; then cp "$f" dist/AgriFlowAI-${AGRIFLOW_VERSION_NAME}-release.apk; else cp "$f" dist/AgriFlowAI-${AGRIFLOW_VERSION_NAME}-release-UNSIGNED.apk; fi
          done
          for f in android/app/build/outputs/bundle/release/*.aab; do
            [ -f "$f" ] || continue
            if [ "$SIGNED" = "yes" ]; then cp "$f" dist/AgriFlowAI-${AGRIFLOW_VERSION_NAME}-release.aab; else cp "$f" dist/AgriFlowAI-${AGRIFLOW_VERSION_NAME}-release-UNSIGNED.aab; fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt) || true
          {
            echo "# AgriFlow AI Android — build ${AGRIFLOW_VERSION_NAME}"
            echo
            echo "- Commit: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`"
            echo "- App id: \`zm.agriflow.ai\` · loads https://agriflow-ai-wheat.vercel.app"
            echo "- Release signing: ${SIGNED}"
            echo
            echo "## Files"; echo '```'; ls -la dist; echo '```'
            echo "## Emulator checks (API 34)"; echo '```'; cat android-results/emulator-checks.txt 2>/dev/null || echo "emulator test did not run"; cat android-results/emulator-totals.txt 2>/dev/null; echo '```'
            echo "## Package"; echo '```'; grep -E "^package|^uses-permission|^sdkVersion|^targetSdkVersion|^application-label" android-results/badging-debug.txt 2>/dev/null; echo '```'
          } > android-results/SUMMARY.md
          echo "- Gradle build: ${{ steps.gradle.outcome }}" >> android-results/SUMMARY.md
          cat android-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          zip -qr dist/android-test-results.zip android-results

      - name: Publish to the "android-latest" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release delete android-latest --cleanup-tag -y 2>/dev/null || true
          shopt -s nullglob
          files=(dist/* android-results/*.png android-results/SUMMARY.md)
          [ -f android-results/gradle-tail.log ] && files+=(android-results/gradle-tail.log)
          gh release create android-latest "${files[@]}" \
            --prerelease --target "${{ github.sha }}" \
            --title "AgriFlow AI Android ${AGRIFLOW_VERSION_NAME} (latest build)" \
            --notes-file android-results/SUMMARY.md

      - name: Fail if the emulator test found problems
        if: always()
        run: test "${{ steps.gradle.outcome }}" = success && grep -q "failed=0" android-results/emulator-totals.txt
